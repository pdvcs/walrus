name = "rustrover"
display_name = "RustRover"
vendor = "JetBrains"
website = "https://www.jetbrains.com/rust/"
description = "Focused IDE for Rust development"

# JetBrains release API (same feed and shape as walrus-intellij.toml):
#   GET /products/releases?code=RR&latest=false&type=release
#     -> { "RR": [ { version, majorVersion, date, build, downloads: { <key>: {...} } }, ... ] }
#   59 releases as of 2026-10-14. Everything comes from the API; nothing is constructed.
# Commercial product — walrus mirrors it for licensed internal users, as with IntelliJ.

[discovery]
type = "json-api"
url = "https://data.services.jetbrains.com/products/releases?code=RR&latest=false&type=release"
releases_path = "$.RR[*]"
release_version_field = "version"
release_date_field = "date"
files_field = "downloads"
files_shape = "platform-map"
file_url_field = "link"
file_checksum_url_field = "checksumLink"
file_size_field = "size"

[versioning]
type = "calver"
# `majorVersion` equals the first two components of `version` for every release (verified 2026-10-14).
version_group_extract = "^(\\d+\\.\\d+)"
# Releases before 2025.1.3 lack the windowsZip and macM1 download keys (verified 2026-10-14), and
# production retention (four groups) never reaches that far back. The floor is 2025.3.7;
# to avoid very old versions, 2025.3.x is the oldest group served.
min_version = "2025.3.7"
lts_support = false

[retention]
versions_per_group = 1
groups_to_keep = 1

# Production retention. Not active: swap in for the production rollout.
# versions_per_group = 2
# groups_to_keep = 4

# Date-anchored embargo, same rationale as IntelliJ (see walrus-intellij.toml).
cooling_off_days = 3

[checksum]
type = "separate-file"
algorithm = "sha256"

# No filename_template: the filename is the API link's own tail (e.g. RustRover-2026.2.3.win.zip).

[[platforms]]
os = "windows"
arch = "x86-64"
os_upstream = "windowsZip"
arch_upstream = "x64"
extension = "zip"

[[platforms]]
os = "macos"
arch = "arm64"
os_upstream = "macM1"
arch_upstream = "aarch64"
extension = "dmg"

[vulnerabilities]
cpes = ["jetbrains:rustrover"]
aliases = ["rustrover", "rust rover", "jetbrains rustrover"]
